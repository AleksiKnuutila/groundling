[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "groundling"
version = "0.0.1"
description = "Grounded Q&A over PDFs with clickable citation viewers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "jinja2>=3.1",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "markdown-it-py>=3.0",
]

[project.optional-dependencies]
# Mode A (`groundling ask`) calls the Anthropic Messages API. The
# skill itself only uses Mode B (prep + render), so this stays out
# of the skill bundle — keeps the cp-version-bound binary wheels
# (jiter, pydantic_core, markupsafe) off the install path.
api = ["anthropic>=0.40"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "anthropic>=0.40",
]

[project.scripts]
groundling = "groundling.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/groundling"]
